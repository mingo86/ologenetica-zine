<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ologenetica — Almanacco delle 64 Chiavi</title>
<meta name="theme-color" content="#0b0f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="holo/fonts.css">
<link rel="stylesheet" href="holo/instrument.css">
<style>
.todaybox{border:1px solid var(--amber-dn);border-radius:3px;background:var(--panel-2);padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.todaybox .tk{font-family:var(--f-mono);font-weight:600;font-size:33px;color:var(--amber);text-shadow:var(--glow);line-height:1}
.todaybox .tt{flex:1;min-width:240px}
.todaybox .tt b{font-family:var(--f-engr);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt)}
.todaybox .tt div{font-size:13.5px;color:var(--dim);line-height:1.55;margin-top:3px}
.todaybox .badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--panel-0);background:var(--amber);padding:2px 8px;border-radius:2px;font-weight:600}
.almrow td:first-child{font-family:var(--f-mono);font-weight:500;color:var(--dim);white-space:nowrap}
.almrow.now td{background:rgba(255,180,84,.07)}
.almrow .ak{font-family:var(--f-mono);font-weight:600;color:var(--amber)}
.almrow .asp{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<!--
THESIS: l'almanacco dello strumento — il calendario solare delle 64 bande, esportabile nel calendario personale; eredita il mondo "Lo Spettrometro".
OWN-WORLD: holo/instrument.css (pannelli, fosfori, tabelle di taratura, mono readouts).
STORY: il lettore vede in quale Chiave è il Sole oggi, scarica l'ICS e il servizio lo accompagna tutto l'anno senza server.
FIRST VIEWPORT: targa, titolo ALMANACCO acceso, modulo OGGI con la Chiave corrente, pulsante ICS, tabella dei 12 mesi.
FORM: estensione del mondo scelto (Lo Spettrometro, seed 84c75ad3) — registro almanacco.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html" title="Home">
      <svg class="dialmark" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="9" stroke-width="1.4"/><line x1="11" y1="11" x2="16.5" y2="6.5" stroke-width="1.4"/><line x1="11" y1="2" x2="11" y2="4.5" stroke-width="1"/><line x1="11" y1="17.5" x2="11" y2="20" stroke-width="1"/><line x1="2" y1="11" x2="4.5" y2="11" stroke-width="1"/><line x1="17.5" y1="11" x2="20" y2="11" stroke-width="1"/></svg>
      Ologenetica</a>
    <div class="topright">
      <div class="nav">
        <a class="pill" data-k="profilo" href="Profilo%20Ologenetico.html">Profilo</a>
        <a class="pill" data-k="chiavi" href="Chiavi.html">Chiavi</a>
        <a class="pill on" data-k="almanacco" href="Almanacco.html">Almanacco</a>
        <a class="pill" data-k="guida" href="Come%20si%20Legge.html">Come si legge</a>
        <a class="pill" data-k="match" href="Compatibilit%C3%A0.html">Compatibilità</a>
      </div>
      <span id="langPick"></span>
    </div>
  </div>

  <div class="hero">
    <h1 class="htitle" id="htitle"></h1>
    <div class="ksuper" id="ksuper"></div>
    <p class="hsub" id="hsub"></p>
    <div class="tickline"></div>
  </div>

  <div class="panel">
    <div class="todaybox" id="todayBox"></div>
    <button class="btn-go" id="icsBtn" style="margin-top:14px"></button>
  </div>

  <div class="panel">
    <div style="overflow-x:auto"><table class="stable" id="almTable"></table></div>
  </div>

  <div class="footnote" id="foot"></div>
</div>

<script src="lang/i18n.js"></script>
<script src="lib/astronomy.browser.min.js"></script>
<script src="holo/keys.it.js"></script>
<script src="holo/keys.en.js"></script>
<script src="holo/keys.fr.js"></script>
<script src="holo/keys.es.js"></script>
<script src="holo/keys.pt.js"></script>
<script src="holo/extra.it.js"></script>
<script src="holo/extra.en.js"></script>
<script src="holo/extra.fr.js"></script>
<script src="holo/extra.es.js"></script>
<script src="holo/extra.pt.js"></script>
<script src="holo/engine.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const langOf = () => window.ZI18N ? window.ZI18N.get() : "it";
  const D = () => window.HOLO_LANGS[langOf()] || window.HOLO_LANGS.it;
  const E = () => window.HOLO_EXTRA[langOf()] || window.HOLO_EXTRA.it;
  const fill = (tpl, p) => String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=>p[k]!=null?p[k]:m);
  const LOCALE = { it:"it-IT", en:"en-GB", fr:"fr-FR", es:"es-ES", pt:"pt-BR" };
  const NAV = {
    it:{profilo:"Profilo",chiavi:"Chiavi",almanacco:"Almanacco",guida:"Come si legge",match:"Compatibilità"},
    en:{profilo:"Profile",chiavi:"Keys",almanacco:"Almanac",guida:"How to read it",match:"Compatibility"},
    fr:{profilo:"Profil",chiavi:"Clés",almanacco:"Almanach",guida:"Comment lire",match:"Compatibilité"},
    es:{profilo:"Perfil",chiavi:"Llaves",almanacco:"Almanaque",guida:"Cómo se lee",match:"Compatibilidad"},
    pt:{profilo:"Perfil",chiavi:"Chaves",almanacco:"Almanaque",guida:"Como ler",match:"Compatibilidade"}
  };
  const FOOT = {
    it:"Effemeridi astronomy-engine · il Sole attraversa un settore di 5,625° in ~5,7 giorni · orari in UTC convertiti al tuo fuso.",
    en:"astronomy-engine ephemerides · the Sun crosses a 5.625° sector in ~5.7 days · times computed in UTC, shown in your timezone.",
    fr:"Éphémérides astronomy-engine · le Soleil traverse un secteur de 5,625° en ~5,7 jours · heures calculées en UTC, affichées dans ton fuseau.",
    es:"Efemérides astronomy-engine · el Sol cruza un sector de 5,625° en ~5,7 días · horas en UTC, mostradas en tu zona horaria.",
    pt:"Efemérides astronomy-engine · o Sol cruza um setor de 5,625° em ~5,7 dias · horários em UTC, exibidos no seu fuso."
  };

  const ALM_LIST = window.HOLO.almanac(new Date());

  const fmtD = d => { try{ return new Intl.DateTimeFormat(LOCALE[langOf()]||"it-IT",{day:"numeric",month:"short"}).format(d);}catch(e){return "";} };
  const fmtDT = d => { try{ return new Intl.DateTimeFormat(LOCALE[langOf()]||"it-IT",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}).format(d);}catch(e){return "";} };

  function render(){
    const X = E().ALM, L = D().LBL, now = new Date();
    $("htitle").innerHTML = X.title.split(" ").length > 1
      ? X.title.split(" ").slice(0,-1).join(" ") + ' <span class="lit">' + X.title.split(" ").pop() + "</span>"
      : `<span class="lit">${X.title}</span>`;
    $("ksuper").textContent = X.ksuper;
    $("hsub").textContent = X.sub;
    const cur = ALM_LIST.find(e => e.start <= now && now < e.end) || ALM_LIST[0];
    const K = D().KEYS[cur.key];
    $("todayBox").innerHTML = `
      <span class="badge">${X.today}</span>
      <span class="tk">${cur.key}</span>
      <div class="tt"><b>${K.o} · ${K.d} · ${K.s}</b>
        <div>${K.t}</div>
        <div style="font-family:var(--f-mono);font-size:11px;margin-top:5px">${fill(X.until,{date:fmtDT(cur.end)})}</div>
      </div>`;
    $("icsBtn").textContent = X.ics;
    $("almTable").innerHTML =
      `<tr><th>${X.tableFrom}</th><th>${X.tableKey}</th><th>${X.tableSpectrum}</th></tr>` +
      ALM_LIST.map(e=>{
        const KK = D().KEYS[e.key];
        const isNow = e === cur;
        return `<tr class="almrow${isNow?" now":""}"><td>${fmtD(e.start)}</td>
          <td class="ak">${e.key}</td>
          <td><span class="asp">${KK.o} · ${KK.d} · ${KK.s}</span></td></tr>`;
      }).join("");
    $("foot").textContent = FOOT[langOf()] || FOOT.it;
    const nav = NAV[langOf()] || NAV.it;
    document.querySelectorAll(".pill[data-k]").forEach(p=>{ if(nav[p.dataset.k]) p.textContent = nav[p.dataset.k]; });
    if(window.ZI18N) window.ZI18N.decorate();
  }

  // --- ICS: le 64 stagioni nel calendario, senza server ---
  function icsDate(d){
    return d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0") +
      "T" + String(d.getUTCHours()).padStart(2,"0") + String(d.getUTCMinutes()).padStart(2,"0") + "00Z";
  }
  function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
  $("icsBtn").addEventListener("click", ()=>{
    const X = E().ALM;
    const stamp = icsDate(new Date());
    let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ologenetica//almanacco//IT\r\nCALSCALE:GREGORIAN\r\n";
    ALM_LIST.forEach((e,i)=>{
      const K = D().KEYS[e.key];
      ics += "BEGIN:VEVENT\r\n";
      ics += "UID:holo-" + e.start.getTime() + "-" + e.key + "@ologenetica\r\n";
      ics += "DTSTAMP:" + stamp + "\r\n";
      ics += "DTSTART:" + icsDate(e.start) + "\r\n";
      ics += "DTEND:" + icsDate(e.end) + "\r\n";
      ics += "SUMMARY:" + esc(fill(X.icsEvt,{key:e.key, d:K.d})) + "\r\n";
      ics += "DESCRIPTION:" + esc(fill(X.icsDesc,{o:K.o, d:K.d, s:K.s, t:K.t})) + "\r\n";
      ics += "END:VEVENT\r\n";
    });
    ics += "END:VCALENDAR\r\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
    a.download = X.icsName + ".ics";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  });

  if(window.ZI18N) window.ZI18N.mount($("langPick"));
  window.addEventListener("zlangchange", render);
  render();
})();
</script>
</body>
</html>
