<style>
.front{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:26px;align-items:center;margin:26px 24px 8px}
@media(max-width:760px){.front{grid-template-columns:1fr;justify-items:center}}
.front .txt2{min-width:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 24px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{
  border:1px solid var(--etch-hi);border-radius:4px;background:var(--panel-1);padding:16px 17px 17px;
  text-decoration:none;color:var(--txt);display:block;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.card:hover{border-color:var(--amber-dn)}
.card .jack{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--panel-0);
  display:inline-block;padding:2px 7px;border-radius:2px;font-weight:600}
.card h3{font-family:var(--f-engr);font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 8px;color:var(--txt);display:flex;align-items:center;gap:9px}
.card p{font-size:13px;color:var(--dim);line-height:1.55;margin:0}
.card .go{font-family:var(--f-mono);font-size:11px;color:var(--amber);margin-top:11px;display:block}
.strip{margin:0 24px;border:1px solid var(--etch);border-radius:4px;background:var(--panel-1);padding:15px 18px}
.strip p{font-size:13.5px;color:var(--dim);line-height:1.65;margin:0;max-width:86ch}
.strip b{color:var(--txt);font-weight:600}
.strip .amberb{color:var(--amber)}
</style>

FORM: derivata dal mondo scelto (Lo Spettrometro, seed 84c75ad3) — frontalino.

  const langOf = () => window.ZI18N ? window.ZI18N.get() : "it";

  // quadrante decorativo dei 64 (statico)
  const WHEEL = [41,19,13,49,30,55,37,63,22,36,25,17,21,51,42,3,27,24,2,23,8,20,16,35,45,12,15,52,39,53,62,56,31,33,7,4,29,59,40,64,47,6,46,18,48,57,32,50,28,44,1,43,14,34,9,5,26,11,10,58,38,54,61,60];
  function dialSVG(){
    const size=320, cx=size/2, cy=size/2, rOut=148, rIn=116, rNum=132;
    const D2R=Math.PI/180, SEC=360/64, ANC=302;
    const ang = lon => 90 - lon;
    const pt = (r,a)=>[cx + r*Math.cos(a*D2R), cy - r*Math.sin(a*D2R)];
    let s=`<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:340px;height:auto" role="img" aria-label="dial 64">`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rOut+6}" fill="#0d110d" stroke="#49564a" stroke-width="1.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rOut}" fill="#121712" stroke="#2c352c" stroke-width="1"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rIn}" fill="#0b0f0b" stroke="#2c352c" stroke-width="1"/>`;
    for(let i=0;i<64;i++){
      const lon0 = ANC + i*SEC;
      const [x0,y0]=pt(rOut,ang(lon0)), [x1,y1]=pt(rIn,ang(lon0));
      s+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2c352c" stroke-width="1"/>`;
      const [nx,ny]=pt(rNum,ang(lon0+SEC/2));
      s+=`<text x="${nx.toFixed(1)}" y="${(ny+2.4).toFixed(1)}" text-anchor="middle" font-size="6.6" font-family="Azeret Mono,monospace" fill="#93a08f">${WHEEL[i]}</text>`;
    }
    // ago acceso sull'esagramma 41 (l'ancora della ruota)
    const [ax,ay]=pt(rIn-4,ang(302+2.8));
    s+=`<line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="#ffb454" stroke-width="1.6"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="30" fill="#121712" stroke="#49564a" stroke-width="1"/>`;
    s+=`<text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="14" font-family="Azeret Mono,monospace" font-weight="600" fill="#ffb454">64</text>`;
    s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="6.5" font-family="Azeret Mono,monospace" fill="#93a08f">KEYS</text>`;
    s+=`</svg>`;
    return s;
  }
  document.getElementById("dial").innerHTML = dialSVG();

  function applyLang(){
    const u = UI[langOf()] || UI.it;
    $("ksuper").textContent = u.ksuper; $("hsub").textContent = u.hsub;
    $("c1h").textContent = u.c1h; $("c1p").textContent = u.c1p;

    $("c5h").textContent = u.c5h; $("c5p").textContent = u.c5p;
    document.querySelectorAll(".card .go").forEach((el,i)=>{ el.textContent = u.goes[i]; });
    $("strip").innerHTML = u.strip; $("foot").textContent = u.foot;
    if(window.ZI18N) window.ZI18N.decorate();
  }
  if(window.ZI18N) window.ZI18N.mount($("langPick"));
  window.addEventListener("zlangchange", applyLang);
  applyLang();
})();
</script>
