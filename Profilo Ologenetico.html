  const U = () => UI[langOf()] || UI.it;

  // --- autocomplete città ---
  const acBox = $("acBox"), fPlace = $("fPlace");
  let acItems = [], acSel = -1;
  function renderAc(list){
    acItems = list; acSel = -1;
    if(!list.length){ acBox.classList.remove("show"); return; }
    acBox.innerHTML = list.map((c,i)=>
      `<div class="ac-item" data-i="${i}">${c.name} <small>· ${c.area}</small></div>`).join("");
    acBox.classList.add("show");
    acBox.querySelectorAll(".ac-item").forEach(el=>{
      el.onclick = ()=> pickPlace(acItems[+el.dataset.i]);
    });
  }
  function pickPlace(c){
    chosenPlace = c; fPlace.value = c.name;
    acBox.classList.remove("show");
    $("placeHint").innerHTML = `<span class="ok">OK</span> ${c.name}, ${c.area}`;
  }
  fPlace.addEventListener("input", ()=>{
    chosenPlace = null; $("placeHint").textContent = U().placeHint;
    renderAc(window.CITY.search(fPlace.value, 8));
  });
  fPlace.addEventListener("keydown", e=>{
    if(!acBox.classList.contains("show")) return;
    if(e.key==="ArrowDown"){acSel=Math.min(acSel+1,acItems.length-1);e.preventDefault();}
    else if(e.key==="ArrowUp"){acSel=Math.max(acSel-1,0);e.preventDefault();}
    else if(e.key==="Enter"){ if(acSel>=0){pickPlace(acItems[acSel]);e.preventDefault();} return;}
    else return;
    acBox.querySelectorAll(".ac-item").forEach((el,i)=>el.classList.toggle("sel",i===acSel));
  });
  document.addEventListener("click", e=>{ if(!fPlace.contains(e.target)&&!acBox.contains(e.target)) acBox.classList.remove("show"); });
  $("fNoTime").addEventListener("change", e=>{
    $("fTime").disabled = e.target.checked;
    if(e.target.checked) $("fTime").value="";
  });

  function showErr(m){ const e=$("errBox"); e.textContent=m; e.classList.add("show"); }

  $("goBtn").addEventListener("click", ()=>{
    $("errBox").classList.remove("show");
    const dateStr = $("fDate").value;
    if(!dateStr) return showErr(U().errDate);
    const [y,mo,d] = dateStr.split("-").map(Number);
    const noTime = $("fNoTime").checked;
    let hour=null, minute=null;
    if(!noTime){
      const t = $("fTime").value;
      if(!t) return showErr(U().errTime);
      [hour,minute] = t.split(":").map(Number);
    }
    let tz = null;
    if(chosenPlace) tz = chosenPlace.tz;
    else if(fPlace.value.trim()) return showErr(U().errPlace);
    else tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

    try{
      curR = window.HOLO.compute({year:y,month:mo,day:d,hour,minute,tz});
      curStab = window.HOLO.stability({year:y,month:mo,day:d,hour,minute,tz});
      curDS = noTime ? window.HOLO.dayStability({year:y,month:mo,day:d,tz}) : null;
    }
    catch(ex){ console.error(ex); return showErr(U().errCalc); }
    curName = $("fName").value.trim();
    updateShareUrl();
    render();
    $("result").style.display="block";
    if(!window.__autorun) $("result").scrollIntoView();
  });

    try{
      const q = new URLSearchParams();

  // --- sintesi strutturale ---
  function structHTML(R){
    const A = window.HOLO.analyze(R);
    const K = D().KEYS, ST = D().STRUCT;
    const rows = [];
    const g = k => K[k].d, o = k => K[k].o;
    rows.push(fill(ST.croce, {
      ps:R.croce.ps, pe:R.croce.pe, ds:R.croce.ds, de:R.croce.de,
      giftPS:g(R.croce.ps), giftPE:g(R.croce.pe), giftDS:g(R.croce.ds), giftDE:g(R.croce.de)
    }));
    rows.push(fill(ST.asse, { a:R.croce.ps, b:R.croce.pe, giftA:g(R.croce.ps), shadowB:o(R.croce.pe) }));
    A.doubles.forEach(dd => rows.push(fill(ST.double, {
      key:dd.key, n:dd.n, gift:g(dd.key), shadow:o(dd.key),
      spheres: dd.spheres.map(k=>D().SPHERES[k].n).join(" + ")
    })));
    A.mirrors.forEach(m => rows.push(fill(ST.mirror, {
      keyA:m.keyA, keyB:m.keyB, giftA:g(m.keyA), giftB:g(m.keyB),
      sphereA:D().SPHERES[m.a].n, sphereB:D().SPHERES[m.b].n
    })));
    if(A.domLine) rows.push(fill(ST.domLine, {
      n:A.domLine.n, line:A.domLine.line, hint:ST.lineHints[A.domLine.line]
    }));
    if(A.starts.length >= 2){
      const keysTxt = A.starts.map(k=>`${k} (${g(k)})`).join(", ");
      const endsTxt = A.ends.map(k=>`${k} (${g(k)})`).join(", ");
      rows.push(fill(A.ends.length ? ST.starts : ST.startsNoEnds, {
        keys:keysTxt, n:A.startSpheresN, ends:endsTxt,
        unconscious: A.startsUnconscious ? ST.startsUnconscious : ""
      }));
    }
    return rows.map(r=>`<div class="structrow">${r}</div>`).join("");
  }

  /* ---- timeline dei cicli ---- */
  function renderTimeline(R){
    const T = window.HOLO.timeline(R), X = E().TL;
    $("tlTitle").textContent = X.title; $("tlSub").textContent = X.sub;
    $("tlBody").innerHTML = timelineSVG(T, X);
    const parts = [];
    if(T.ageNow < 7) parts.push(X.phases.sq);
    else if(T.ageNow < 14) parts.push(X.phases.eq);
    else if(T.ageNow < 21) parts.push(X.phases.iq);
    else parts.push(X.phases.adult);
    if(T.line6) parts.push(T.ageNow < 30 ? X.phases.l6p1 : T.ageNow < 50 ? X.phases.l6p2 : X.phases.l6p3);
    $("tlNow").textContent = fill(X.nowTpl, { age: Math.floor(T.ageNow), phase: parts.join(" ") });
  }
  function timelineSVG(T, X){
    const W=780, PAD=42, SPAN=84, y0=34;
    const line6 = !!T.line6;
    const H = line6 ? 158 : 122;
    const px = age => PAD + Math.min(age,SPAN)/SPAN*(W-2*PAD);
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:820px;min-width:560px;height:auto">`;
    // asse con tacche ogni 7 anni
    s += `<line x1="${PAD}" y1="${H-26}" x2="${W-PAD}" y2="${H-26}" stroke="#49564a" stroke-width="1"/>`;
    for(let a=0;a<=SPAN;a+=7){
      s += `<line x1="${px(a)}" y1="${H-26}" x2="${px(a)}" y2="${H-32}" stroke="#49564a" stroke-width="1"/>`;
      if(a%14===0) s += `<text x="${px(a)}" y="${H-12}" text-anchor="middle" font-size="9" font-family="Azeret Mono,monospace" fill="#93a08f">${a}</text>`;
    }
    // cicli di Venere (0-7-14-21): inchiostro di canale a passi di opacità
    const segOp = { sq:0.85, eq:0.55, iq:0.3 };
    T.segs.forEach(g=>{
      s += `<rect x="${px(g.from)}" y="${y0}" width="${px(g.to)-px(g.from)}" height="13" fill="#e2a3da" opacity="${segOp[g.k]}" stroke="#0b0f0b" stroke-width="1"/>`;
      s += `<text x="${(px(g.from)+px(g.to))/2}" y="${y0-6}" text-anchor="middle" font-size="8.5" font-family="Azeret Mono,monospace" fill="#93a08f">${X.segs[g.k]}</text>`;
    });
    // fasi della Linea 6
    if(line6){
      T.line6.forEach(g=>{
        s += `<rect x="${px(g.from)}" y="${y0+34}" width="${px(g.to)-px(g.from)}" height="13" fill="none" stroke="#b97f33" stroke-width="1"/>`;
        s += `<rect x="${px(g.from)}" y="${y0+34}" width="${px(g.to)-px(g.from)}" height="13" fill="#ffb454" opacity="${g.k==='l6p1'?0.25:g.k==='l6p2'?0.5:0.8}"/>`;
        s += `<text x="${(px(g.from)+px(g.to))/2}" y="${y0+58}" text-anchor="middle" font-size="8.5" font-family="Azeret Mono,monospace" fill="#93a08f">${X.line6[g.k]}</text>`;
      });
    }
    // ritorni di Saturno
    T.marks.forEach(m=>{
      s += `<line x1="${px(m.age)}" y1="${y0-14}" x2="${px(m.age)}" y2="${H-26}" stroke="#93e2b4" stroke-width="1" stroke-dasharray="3 3"/>`;
      s += `<text x="${px(m.age)}" y="${y0-18}" text-anchor="middle" font-size="8" font-family="Azeret Mono,monospace" fill="#93e2b4">${X.marks[m.k]}</text>`;
    });
    // ago di oggi
    if(T.ageNow > 0 && T.ageNow < SPAN){
      s += `<line x1="${px(T.ageNow)}" y1="${y0-4}" x2="${px(T.ageNow)}" y2="${H-26}" stroke="#ffb454" stroke-width="2"/>`;
      s += `<text x="${px(T.ageNow)}" y="${H-2}" text-anchor="middle" font-size="9" font-weight="600" font-family="Azeret Mono,monospace" fill="#ffb454">${X.now}</text>`;
    }
    return s + "</svg>";
  }

  async function makePoster(R){
    await document.fonts.ready;
    const W=1080, H=1440;
    const c = document.createElement("canvas"); c.width=W; c.height=H;
    const x = c.getContext("2d");
    x.fillStyle="#0b0f0b"; x.fillRect(0,0,W,H);
    x.strokeStyle="#49564a"; x.lineWidth=2; x.strokeRect(26,26,W-52,H-52);
    x.strokeStyle="#2c352c"; x.lineWidth=1; x.strokeRect(40,40,W-80,H-80);
    x.textAlign="center";
    try{ x.letterSpacing = "14px"; }catch(e){}
    x.fillStyle="#cdd5c8"; x.font="700 56px 'Saira Semi Condensed'";
    x.fillText("OLOGENETICA", W/2, 128);
    try{ x.letterSpacing = "6px"; }catch(e){}
    x.fillStyle="#93a08f"; x.font="500 20px 'Azeret Mono'";
    x.fillText(E().PST.subtitle, W/2, 166);
    try{ x.letterSpacing = "0px"; }catch(e){}
    // nome + dati
    x.fillStyle="#ffb454"; x.font="600 26px 'Azeret Mono'";
    const tz = R.input.tz || "UTC";
    x.fillText((curName ? curName + " · " : "") + fmtDT(R.utc, tz), W/2, 214);
    // quadrante
    const cx=W/2, cy=640, rOut=340, rIn=268, rNum=304, rMark=238;
    const D2R=Math.PI/180, ang=lon=>90-lon;
    const pt=(r,a)=>[cx + r*Math.cos(a*D2R), cy - r*Math.sin(a*D2R)];
    x.beginPath(); x.arc(cx,cy,rOut+14,0,7); x.fillStyle="#0d110d"; x.fill();
    x.strokeStyle="#49564a"; x.lineWidth=2.5; x.stroke();
    x.beginPath(); x.arc(cx,cy,rOut,0,7); x.fillStyle="#121712"; x.fill();
    x.strokeStyle="#2c352c"; x.lineWidth=1.5; x.stroke();
    x.beginPath(); x.arc(cx,cy,rIn,0,7); x.fillStyle="#0b0f0b"; x.fill();
    x.strokeStyle="#2c352c"; x.stroke();
    const SEC=window.HOLO.SECTOR, ANC=window.HOLO.ANCHOR;
    x.font="500 15px 'Azeret Mono'"; x.fillStyle="#93a08f";
    for(let i=0;i<64;i++){
      const lon0=ANC+i*SEC;
      const [x0,y0]=pt(rOut,ang(lon0)), [x1,y1]=pt(rIn,ang(lon0));
      x.beginPath(); x.moveTo(x0,y0); x.lineTo(x1,y1); x.strokeStyle="#2c352c"; x.lineWidth=1; x.stroke();
      const [nx,ny]=pt(rNum,ang(lon0+SEC/2));
      x.fillText(String(window.HOLO.WHEEL[i]), nx, ny+5);
    }
    R.spheres.forEach(sp=>{
      const hex=CH[sp.seq].hex;
      const [mx,my]=pt(rMark,ang(sp.lonDeg));
      const [lx,ly]=pt(rIn,ang(sp.lonDeg));
      x.beginPath(); x.moveTo(lx,ly); x.lineTo(mx,my); x.strokeStyle=hex; x.lineWidth=2.5; x.stroke();
      x.fillStyle=hex; x.fillRect(mx-8,my-8,16,16);
      x.strokeStyle="#0b0f0b"; x.lineWidth=2; x.strokeRect(mx-8,my-8,16,16);
    });
    x.beginPath(); x.arc(cx,cy,64,0,7); x.fillStyle="#121712"; x.fill();
    x.strokeStyle="#49564a"; x.lineWidth=1.5; x.stroke();
    x.fillStyle="#ffb454"; x.font="600 30px 'Azeret Mono'"; x.fillText("64", cx, cy+4);
    x.fillStyle="#93a08f"; x.font="500 14px 'Azeret Mono'"; x.fillText("KEYS", cx, cy+30);
    // le 11 sfere in tre colonne canale
    const cols = { attivazione:200, venere:540, perla:880 };
    const heads = { attivazione:"CH·1", venere:"CH·2", perla:"CH·3" };
    let yy = { attivazione:1078, venere:1078, perla:1078 };
    ["attivazione","venere","perla"].forEach(sq=>{
      x.fillStyle=CH[sq].hex; x.font="600 20px 'Azeret Mono'";
      x.fillText(heads[sq]+" "+D().SEQ[sq].n.toUpperCase().slice(0,22), cols[sq], yy[sq]); yy[sq]+=34;
    });
    R.spheres.forEach(sp=>{
      const col = cols[sp.seq];
      x.fillStyle="#cdd5c8"; x.font="500 19px 'Azeret Mono'";
      x.fillText(D().SPHERES[sp.k].n.toUpperCase()+"  "+sp.label, col, yy[sp.seq]); yy[sp.seq]+=30;
    });
    // piede
    x.fillStyle="#93a08f"; x.font="500 18px 'Azeret Mono'";
    x.fillText(`${E().PST.linee} ${R.profileLines[0]}/${R.profileLines[1]}   ·   ${E().PST.croce} ${R.croce.ps}/${R.croce.pe} | ${R.croce.ds}/${R.croce.de}`, W/2, 1330);
    x.fillStyle="#49564a"; x.font="500 14px 'Azeret Mono'";
    x.fillText("ologenetica · mod. 64", W/2, 1368);
    await new Promise(res=>{
      c.toBlob(b=>{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(b);
        a.download="ologenetica-quadrante.png";
        a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000); res();
      }, "image/png");
    });
  }

  function applyMode(){
    const rep = viewMode === "report";
    $("modeSimple").classList.toggle("on", !rep);
    $("modeReport").classList.toggle("on", rep);
    $("viewSimple").style.display = rep ? "none" : "block";
    $("viewReport").style.display = rep ? "block" : "none";
  }
  $("modeSimple").onclick = ()=>{ viewMode="simple"; applyMode(); };
  $("modeReport").onclick = ()=>{ viewMode="report"; applyMode(); };

  // il quadrante: dial inciso su pannello scuro
  function wheelSVG(R){
    const size=340, cx=size/2, cy=size/2, rOut=158, rIn=124, rNum=141, rMark=110, rTick=118;
    const D2R=Math.PI/180;
    const ang = lon => 90 - lon;
    const pt = (r,a)=>[cx + r*Math.cos(a*D2R), cy - r*Math.sin(a*D2R)];
    let s=`<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:380px;height:auto;overflow:visible" role="img" aria-label="dial">`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rOut+6}" fill="#0d110d" stroke="#49564a" stroke-width="1.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rOut}" fill="#121712" stroke="#2c352c" stroke-width="1"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rIn}" fill="#0b0f0b" stroke="#2c352c" stroke-width="1"/>`;
    const SEC = window.HOLO.SECTOR, ANC = window.HOLO.ANCHOR;
    for(let i=0;i<64;i++){
      const lon0 = ANC + i*SEC;
      const [x0,y0]=pt(rOut,ang(lon0)), [x1,y1]=pt(rIn,ang(lon0));
      s+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2c352c" stroke-width="1"/>`;
      const [nx,ny]=pt(rNum,ang(lon0+SEC/2));
      s+=`<text x="${nx.toFixed(1)}" y="${(ny+2.4).toFixed(1)}" text-anchor="middle" font-size="7" font-family="Azeret Mono,monospace" fill="#93a08f">${window.HOLO.WHEEL[i]}</text>`;
      for(let l=1;l<6;l++){
        const [tx0,ty0]=pt(rIn,ang(lon0+l*SEC/6)), [tx1,ty1]=pt(rTick,ang(lon0+l*SEC/6));
        s+=`<line x1="${tx0.toFixed(1)}" y1="${ty0.toFixed(1)}" x2="${tx1.toFixed(1)}" y2="${ty1.toFixed(1)}" stroke="#2c352c" stroke-width="0.5"/>`;
      }
    }
    R.spheres.forEach(sp=>{
      const hex = CH[sp.seq].hex;
      const [mx,my]=pt(rMark,ang(sp.lonDeg));
      const [lx,ly]=pt(rIn,ang(sp.lonDeg));
      s+=`<line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="${hex}" stroke-width="1.2"/>`;
      s+=`<rect x="${(mx-3.4).toFixed(1)}" y="${(my-3.4).toFixed(1)}" width="6.8" height="6.8" fill="${hex}" stroke="#0b0f0b" stroke-width="1"/>`;
    });
    s+=`<circle cx="${cx}" cy="${cy}" r="30" fill="#121712" stroke="#49564a" stroke-width="1"/>`;
    s+=`<text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="14" font-family="Azeret Mono,monospace" font-weight="600" fill="#ffb454">64</text>`;
    s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="6.5" font-family="Azeret Mono,monospace" fill="#93a08f">KEYS</text>`;
    s+=`</svg>`;
    return s;
  }

  // --- applica lingua ---
  function applyLang(){
    const u = U();
    $("htitle").innerHTML = `${u.htitle[0]}<span class="lit">${u.htitle[1]}</span>`;
    $("ksuper").textContent = u.ksuper; $("hsub").textContent = u.hsub;
    $("formTitle").textContent = u.formTitle;
    $("lblName").textContent = u.lblName; $("fName").placeholder = u.phName;
    $("lblDate").textContent = u.lblDate; $("lblTime").textContent = u.lblTime; $("lblNoTime").textContent = u.lblNoTime;
    $("lblPlace").textContent = u.lblPlace; $("fPlace").placeholder = u.phPlace;
    if(!chosenPlace) $("placeHint").textContent = u.placeHint;
    $("goBtn").textContent = u.go;
    $("modeSimple").textContent = u.modeSimple; $("modeReport").textContent = u.modeReport;
    $("wheelTitle").textContent = u.wheelTitle; $("wheelSub").textContent = u.wheelSub;
    $("foot").innerHTML = u.foot;
    document.querySelectorAll(".pill[data-k]").forEach(p=>{ if(u.nav[p.dataset.k]) p.textContent = u.nav[p.dataset.k]; });
    if(curR) render();
  }
  if(window.ZI18N) window.ZI18N.mount($("langPick"));
  window.addEventListener("zlangchange", applyLang);
  applyLang();

  // --- link condivisibile: ?d=YYYY-MM-DD&t=HH:MM&city=Nome&n=Nome&view=report&run=1 ---
  try{
    const q = new URLSearchParams(location.search);
    if(q.get("run") === "1" && q.get("d")){
      window.__autorun = true;
      $("fDate").value = q.get("d");
      if(q.get("t")) $("fTime").value = q.get("t");
      else { $("fNoTime").checked = true; $("fTime").disabled = true; }
      if(q.get("n")) $("fName").value = q.get("n");
      if(q.get("city")){
        const hits = window.CITY.search(q.get("city"), 1);
        if(hits.length) pickPlace(hits[0]);
      }
      if(q.get("view") === "report") viewMode = "report";
      $("goBtn").click();
    }
  }catch(e){}
})();
</script>
