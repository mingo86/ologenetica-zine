<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ologenetica — Come si legge e come si calcola</title>
<meta name="theme-color" content="#0b0f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="holo/fonts.css">
<link rel="stylesheet" href="holo/instrument.css">
<style>
/* alias canali per i contenuti della guida (i pacchetti lingua usano --red/--pink/--blue) */
:root{ --red:var(--amber); --pink:var(--mag); --blue:var(--blu); --teal:var(--mint); --yellow:var(--amber); }
.panel p, .panel li{font-size:14px;color:var(--txt);line-height:1.65;max-width:78ch}
.panel p b, .panel li b{color:var(--txt);font-weight:600}
.panel i{color:var(--dim)}
.panel ol, .panel ul{padding-left:22px;margin:8px 0}
.mono{
  font-family:var(--f-mono);font-size:12px;background:var(--recess);border:1px solid var(--etch-hi);
  border-radius:3px;box-shadow:inset 0 2px 5px rgba(0,0,0,.55);color:var(--amber);
  padding:11px 14px;margin:12px 0;line-height:1.7;overflow-x:auto;
}
.steps{counter-reset:st;list-style:none;padding:0;margin:12px 0 0}
.steps li{position:relative;padding:0 0 16px 46px;counter-increment:st}
.steps li::before{
  content:counter(st,decimal-leading-zero);position:absolute;left:0;top:1px;width:30px;height:22px;
  font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--amber);
  border:1px solid var(--etch-hi);border-radius:2px;background:var(--recess);
  display:flex;align-items:center;justify-content:center;
}
.spectrum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media(max-width:640px){.spectrum{grid-template-columns:1fr}}
.spec{border:1px solid var(--etch-hi);border-radius:3px;padding:12px 13px;background:var(--panel-2)}
.spec .t{font-family:var(--f-engr);font-weight:600;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase}
.spec p{font-size:12.5px;margin:7px 0 0;color:var(--dim)}
.spec.o{background:var(--panel-2);position:relative}
.spec.o{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.28) 6px 9px)}
.spec.o .t{color:var(--txt)}
.spec.d .t{color:var(--amber);text-shadow:var(--glow)}
.spec.s .t{color:var(--mint)}
.spec.s p,.spec.d p{color:var(--dim)}
.stable .sq{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:7px;vertical-align:-1px;border:none}
.linegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:640px){.linegrid{grid-template-columns:1fr}}
.linecard{border:1px solid var(--etch);border-radius:3px;background:var(--panel-2);padding:11px 13px}
.linecard b{font-family:var(--f-engr);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt)}
.linecard p{font-size:12.5px;margin:5px 0 0;color:var(--dim)}
</style>
</head>
<body>
<!--
THESIS: il manuale d'uso dello strumento — la spiegazione del calcolo come pagina di manuale tecnico, non blog mistico.
OWN-WORLD: mondo "Lo Spettrometro" condiviso (holo/instrument.css); i passi come contatori mono incisi, le formule su display incassato.
STORY: il lettore capisce da dove escono i numeri e come contemplare lo spettro.
FIRST VIEWPORT: targa, titolo COME SI LEGGE con accensione ambra, riga spec, primo pannello "idea in 30 secondi".
FORM: derivata dal mondo scelto (Lo Spettrometro, seed 84c75ad3) — registro manuale d'uso.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html" title="Home">
      <svg class="dialmark" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="9" stroke-width="1.4"/><line x1="11" y1="11" x2="16.5" y2="6.5" stroke-width="1.4"/><line x1="11" y1="2" x2="11" y2="4.5" stroke-width="1"/><line x1="11" y1="17.5" x2="11" y2="20" stroke-width="1"/><line x1="2" y1="11" x2="4.5" y2="11" stroke-width="1"/><line x1="17.5" y1="11" x2="20" y2="11" stroke-width="1"/></svg>
      Ologenetica</a>
    <div class="topright">
      <div class="nav">
        <a class="pill" data-k="profilo" href="Profilo%20Ologenetico.html">Profilo</a>
        <a class="pill" data-k="chiavi" href="Chiavi.html">Chiavi</a>
        <a class="pill" data-k="almanacco" href="Almanacco.html">Almanacco</a>
        <a class="pill on" data-k="guida" href="Come%20si%20Legge.html">Come si legge</a>
        <a class="pill" data-k="match" href="Compatibilit%C3%A0.html">Compatibilità</a>
      </div>
      <span id="langPick"></span>
    </div>
  </div>

  <div class="hero">
    <h1 class="htitle" id="htitle"></h1>
    <div class="ksuper" id="ksuper"></div>
    <p class="hsub" id="hsub"></p>
    <div class="tickline"></div>
  </div>

  <div id="panels"></div>

  <div class="footnote" id="foot"></div>
</div>

<script src="lang/i18n.js"></script>
<script src="holo/guide.it.js"></script>
<script src="holo/guide.en.js"></script>
<script src="holo/guide.fr.js"></script>
<script src="holo/guide.es.js"></script>
<script src="holo/guide.pt.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const langOf = () => window.ZI18N ? window.ZI18N.get() : "it";
  const NAV = {
    it:{profilo:"Profilo",chiavi:"Chiavi",almanacco:"Almanacco",guida:"Come si legge",match:"Compatibilità"},
    en:{profilo:"Profile",chiavi:"Keys",almanacco:"Almanac",guida:"How to read it",match:"Compatibility"},
    fr:{profilo:"Profil",chiavi:"Clés",almanacco:"Almanach",guida:"Comment lire",match:"Compatibilité"},
    es:{profilo:"Perfil",chiavi:"Llaves",almanacco:"Almanaque",guida:"Cómo se lee",match:"Compatibilidad"},
    pt:{profilo:"Perfil",chiavi:"Chaves",almanacco:"Almanaque",guida:"Como ler",match:"Compatibilidade"}
  };
  const SPEC = {
    it:"MANUALE D'USO · CALCOLO E LETTURA", en:"OPERATING MANUAL · CALCULATION AND READING",
    fr:"MANUEL D'UTILISATION · CALCUL ET LECTURE", es:"MANUAL DE USO · CÁLCULO Y LECTURA",
    pt:"MANUAL DE USO · CÁLCULO E LEITURA"
  };
  function splitTitle(t){
    // accende in ambra l'ultima parola del titolo
    const parts = t.split(" ");
    if(parts.length < 2) return `<span class="lit">${t}</span>`;
    const last = parts.pop();
    return `${parts.join(" ")} <span class="lit">${last}</span>`;
  }
  function applyLang(){
    const G = window.HOLO_GUIDE[langOf()] || window.HOLO_GUIDE.it;
    $("htitle").innerHTML = splitTitle(G.title);
    $("ksuper").textContent = SPEC[langOf()] || SPEC.it;
    $("hsub").textContent = G.sub;
    $("panels").innerHTML = G.panels.map(p =>
      `<div class="panel"><h2>${p.h}</h2>${p.html}</div>`).join("");
    $("foot").textContent = G.foot;
    const nav = NAV[langOf()] || NAV.it;
    document.querySelectorAll(".pill[data-k]").forEach(p=>{ if(nav[p.dataset.k]) p.textContent = nav[p.dataset.k]; });
    if(window.ZI18N) window.ZI18N.decorate();
  }
  if(window.ZI18N) window.ZI18N.mount($("langPick"));
  window.addEventListener("zlangchange", applyLang);
  applyLang();
})();
</script>
</body>
</html>
